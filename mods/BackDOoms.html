<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackDooms</title>
    <link rel="stylesheet" href="/style.css">
    <style>
      @font-face {
          font-family: 'BackroomsEndCredits-Regular';
          src: url('/mods/BackroomsEndCredits-Regular.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: swap;
      }
      header h1 {
        margin: 0 0 16px 0;
        font-family: "BackroomsEndCredits-Regular", Arial, sans-serif;
        font-size: clamp(1.6rem, 3vw, 2rem);
        color: #e0add4;
        line-height: 1.15;
      }
      body {
        background-image: url("duqum8g8o3dh1.png");
        background-color: #83762d;
        color: #5b5119;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      a {
        color: #756119;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.15em;
      }

      a:visited {
        color: #8e6903;
      }

      a:hover {
        color: #cd9301;
      }

      a:active {
        color: #ff8c00;
      }

      a:focus-visible {
        outline: 2px solid #e0add4;
        outline-offset: 2px;
      }
      .backrooms {
        font-family: "BackroomsEndCredits-Regular", Arial, sans-serif;
        font-size: 40px;
      }
    </style>
</head>
<body>
    <script src="/header.js"></script>
    <main>
      <img src="backdooms.png" loading="lazy" style="image-rendering: pixelated; width: auto; height: auto; max-width: 100%; margin-top: 16px;">
      
      <p class="backrooms">the more times it tries to remember something. the less it does</p>
      <p>UZDoom is needed to run this mod</p>
      <a href="BackDooms.pk3">Download it here</a>
    </main>
</body>
</html>
