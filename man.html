<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lrm;</title>
    <style>
        @font-face {
            font-family: 'DeterminationMono';
            src: url('DeterminationMonoWeb.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        #ayll {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            image-rendering: pixelated;          
            display: block;
            opacity: 1;
            cursor: default;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        #ayll2 {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            image-rendering: pixelated;
            display: block;
            opacity: 0;
            cursor: default;
            user-select: none;
            -webkit-webkit-user-drag: none;
            pointer-events: none;
        }

        #ayll.active {
            cursor: pointer;
            pointer-events: auto;
        }

        #kphsvnbl {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            width: 640px;
            max-width: calc(100vw - 40px);
            min-height: 120px;
            padding: 18px 24px;
            border: 10px solid white;
            background: rgba(0, 0, 0, 0.92);
            color: white;
            box-sizing: border-box;
            display: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            text-align: left;
            font-family: 'DeterminationMono', monospace;
            font-size: 32px;
            line-height: 1.5;
            white-space: pre-line;
            z-index: 10;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeSpeed;
        }

        #kphsvnblAlea {
            width: 100%;
        }
    </style>
</head>
<body>

<audio id="tbzpj" src="man.ogg" loop preload="auto"></audio>
<img id="ayll" src="images/darktree.png" alt="ayll">
<img id="ayll2" src="images/darken.png" alt="ayll">
<div id="kphsvnbl"><div id="kphsvnblAlea"></div></div>

<script>
(() => {
    const audio = document.getElementById("tbzpj");
    const treeImage = document.getElementById("ayll");
    const darkenImage = document.getElementById("ayll2");
    const messageBox = document.getElementById("kphsvnbl");
    const messageText = document.getElementById("kphsvnblAlea");
    const messages = [
        "* (Well, there is a man here.)",
        "* (He offered you something.)",
        "* (You got the egg.)"
    ];
    const returnUrl = sessionStorage.getItem("returnUrl") || document.referrer || "index.html";
    
    let messageIndex = 0;
    let isTyping = false;
    let isAudioPlaying = false;

    const playAudio = () => {
        if (isAudioPlaying) return;
        isAudioPlaying = true;
        treeImage.classList.add("active");
        treeImage.src = "images/tree.png";
        darkenImage.style.display = "none";
        audio.play().catch(() => {
            isAudioPlaying = false;
            treeImage.classList.remove("active");
        });
    };

    const typeMessage = (message, callback) => {
        isTyping = true;
        messageText.textContent = "";
        let charIndex = 0;
        const typeInterval = setInterval(() => {
            messageText.textContent += message[charIndex++];
            if (charIndex >= message.length) {
                clearInterval(typeInterval);
                isTyping = false;
                callback?.();
            }
        }, 35);
    };

    const showMessage = () => {
        if (!isAudioPlaying || messageBox.style.display === "flex") return;
        messageBox.style.display = "flex";
        messageBox.style.opacity = "1";
        messageIndex = 0;
        typeMessage(messages[0]);
    };

    const nextMessage = () => {
        if (isTyping || ++messageIndex >= messages.length) return;

        if (messageIndex === 2) {
            audio.pause();
            audio.currentTime = 0;
            isAudioPlaying = false;
            treeImage.classList.remove("active");
        }

        typeMessage(messages[messageIndex], () => {
            if (messageIndex === 2) {
                localStorage.setItem("manegg", "true");

                setTimeout(() => {
                    darkenImage.style.display = "block";
                    darkenImage.src = "images/notree.png";
                    darkenImage.style.transition = "none";
                    darkenImage.style.opacity = "0";
                    treeImage.style.transition = "none";
                    treeImage.style.opacity = "1";
                    messageBox.style.transition = "none";
                    messageBox.style.opacity = "1";

                    const treeMaskSteps = [0.25, 0.5, 0.75, 1];
                    treeMaskSteps.forEach((opacity, index) => {
                        setTimeout(() => {
                            darkenImage.style.opacity = String(opacity);
                        }, index * 1000);
                    });

                    setTimeout(() => {
                        const treeFadeSteps = [1, 0.75, 0.5, 0.25, 0];
                        treeFadeSteps.forEach((opacity, index) => {
                            setTimeout(() => {
                                treeImage.style.opacity = String(opacity);
                            }, index * 1000);
                        });

                        setTimeout(() => {
                            darkenImage.src = "images/darken.png";
                            darkenImage.style.opacity = "0";

                            const cloudDarkenSteps = [0.25, 0.5, 0.75, 1];
                            cloudDarkenSteps.forEach((opacity, index) => {
                                setTimeout(() => {
                                    darkenImage.style.opacity = String(opacity);
                                }, index * 1000);
                            });

                            setTimeout(() => {
                                darkenImage.style.opacity = "1";
                                location.href = returnUrl;
                            }, 4 * 1000 + 250);
                        }, 4 * 1000 + 250);
                    }, 4 * 1000 + 250);
                }, 1000);
            }
        });
    };

    document.addEventListener("pointerdown", playAudio, { once: true });
    treeImage.addEventListener("click", showMessage);
    messageBox.addEventListener("click", nextMessage);
})();
</script>

</body>
</html>
