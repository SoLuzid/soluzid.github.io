<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art</title>

    <link href="/style.css" rel="stylesheet">
    <link href="art.css" rel="stylesheet">
    <link href="/gallery.css" rel="stylesheet">
  </head>

  <body>
    <script src="/header.js"></script>

    <main class="art-page">
      <div class="art-container">
        <div class="art-header">
          <h2><a href="/art/">go back</a></h2>
        </div>

        <div class="art-toolbar" aria-label="Art zoom controls">
          <button class="zoom-btn" type="button" data-zoom="out" aria-label="Zoom out">−</button>
          <button class="zoom-btn" type="button" data-zoom="reset" aria-label="Reset zoom">100%</button>
          <button class="zoom-btn" type="button" data-zoom="in" aria-label="Zoom in">+</button>
        </div>

        <div class="art-stage" id="artStage">
          <img id="artImage" alt="art">
        </div>

        <p id="artCaption" class="art-caption"></p>
      </div>
    </main>

    <script src="art-data.js"></script>
      <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const container = document.querySelector(".art-container");
      const img = document.getElementById("artImage");
      const caption = document.getElementById("artCaption");
      const artStage = document.getElementById("artStage");
      const zoomButtons = document.querySelectorAll(".zoom-btn");
      const STEP = 0.25;
      const MAX_ZOOM = 1.1256733645075604e+32;
      const MIN_ZOOM = -1.1256733645075604e+32;
      let zoom = 1;
      let offsetX = 0;
      let offsetY = 0;
      let activePointers = new Map();
      let dragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;

      function applyTransform() {
        const displayZoom = Math.abs(zoom) || 1;
        const rotation = zoom < 0 ? 180 : 0;
        const isHidden = Math.abs(zoom) < 0.01;
        img.style.opacity = isHidden ? "0" : "1";
        img.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${rotation}deg) scale(${displayZoom})`;
        const resetButton = document.querySelector('[data-zoom="reset"]');
        if (resetButton) {
          resetButton.textContent = `${Math.round(zoom * 100)}%`;
        }
      }

      function setZoom(nextZoom, anchorX = artStage.clientWidth / 2, anchorY = artStage.clientHeight / 2) {
        const previousZoom = Math.abs(zoom) < 0.01 ? 1 : zoom;
        const safeZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextZoom));
        const centerX = anchorX - artStage.clientWidth / 2;
        const centerY = anchorY - artStage.clientHeight / 2;
        const imageX = (centerX - offsetX) / previousZoom;
        const imageY = (centerY - offsetY) / previousZoom;

        zoom = safeZoom;
        offsetX = centerX - imageX * zoom;
        offsetY = centerY - imageY * zoom;
        applyTransform();
      }

      function resetView() {
        zoom = 1;
        offsetX = 0;
        offsetY = 0;
        applyTransform();
      }

      if (!id || !ART_DATA[id]) {
        container.innerHTML = "";

        const wobbleTitle = document.createElement("h1");
        wobbleTitle.id = "wobbleText";
        wobbleTitle.style.fontSize = "60px";
        wobbleTitle.textContent = "Art Not Found!!";
        container.appendChild(wobbleTitle);

        const msgEl = document.createElement("p");
        msgEl.id = "randomMessage";
        msgEl.style.fontSize = "25px";
        container.appendChild(msgEl);

        const textEl = wobbleTitle;
        const text = textEl.textContent;
        textEl.textContent = "";

        const chars = [];
        for (let i = 0; i < text.length; i++) {
          const span = document.createElement("span");
          span.className = "wobble-char";
          span.textContent = text[i] === " " ? "\u00A0" : text[i];
          textEl.appendChild(span);
          chars.push(span);
        }

        function animate() {
          const time = Date.now();
          for (let i = 0; i < chars.length; i++) {
            chars[i].style.transform = `translateY(${Math.sin((time/500) + i*0.6)*4}px)`;
          }
          requestAnimationFrame(animate);
        }
        animate();

        const messages = [
          "maybe you put the wrong URL? or this art hasn't been made yet. :3",
          "you probably put the wrong URL or I forgot to add this art",
          "wrong URL? or the art is missing...",
          "this art was probably deleted, broken link, or wrong id :("
        ];
        msgEl.textContent = messages[Math.floor(Math.random() * messages.length)];

        const titles = [
          "art has not been found :(",
          "art not found :c",
          "this art is missing :(",
          "art not found!!"
        ];
        document.title = titles[Math.floor(Math.random() * titles.length)];

        throw new Error("Invalid art id");
      }

      const art = ART_DATA[id];
      document.title = art.title;
      img.src = art.image;
      img.className = "art-image";
      caption.textContent = art.caption;
      applyTransform();

      zoomButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.zoom;
          const centerX = artStage.clientWidth / 2;
          const centerY = artStage.clientHeight / 2;
          if (mode === "in") {
            setZoom(zoom + STEP, centerX, centerY);
          } else if (mode === "out") {
            setZoom(zoom - STEP, centerX, centerY);
          } else {
            resetView();
          }
        });
      });

      artStage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const rect = artStage.getBoundingClientRect();
        const pointerX = event.clientX - rect.left;
        const pointerY = event.clientY - rect.top;
        const factor = event.deltaY < 0 ? 1.12 : 0.88;
        setZoom(zoom * factor, pointerX, pointerY);
      }, { passive: false });

      artStage.addEventListener("pointerdown", (event) => {
        artStage.setPointerCapture(event.pointerId);
        activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (activePointers.size === 1) {
          dragging = true;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          dragOffsetX = offsetX;
          dragOffsetY = offsetY;
          artStage.classList.add("dragging");
        }

        if (activePointers.size === 2) {
          const [first, second] = Array.from(activePointers.values());
          pinchStartDistance = Math.hypot(second.x - first.x, second.y - first.y);
          pinchStartZoom = zoom;
        }
      });

      artStage.addEventListener("pointermove", (event) => {
        if (!activePointers.has(event.pointerId)) {
          return;
        }

        activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (activePointers.size === 1 && dragging) {
          const dx = event.clientX - dragStartX;
          const dy = event.clientY - dragStartY;
          offsetX = dragOffsetX + dx;
          offsetY = dragOffsetY + dy;
          applyTransform();
        }

        if (activePointers.size >= 2) {
          const [first, second] = Array.from(activePointers.values());
          const currentDistance = Math.hypot(second.x - first.x, second.y - first.y);
          const centerX = (first.x + second.x) / 2 - artStage.getBoundingClientRect().left;
          const centerY = (first.y + second.y) / 2 - artStage.getBoundingClientRect().top;

          if (pinchStartDistance > 0) {
            setZoom(pinchStartZoom * (currentDistance / pinchStartDistance), centerX, centerY);
          }
        }
      });

      function endPointer(event) {
        activePointers.delete(event.pointerId);

        if (activePointers.size < 2) {
          pinchStartDistance = 0;
        }

        if (activePointers.size === 0) {
          dragging = false;
          artStage.classList.remove("dragging");
        }
      }

      artStage.addEventListener("pointerup", endPointer);
      artStage.addEventListener("pointercancel", endPointer);
      artStage.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "mouse" && activePointers.size === 1) {
          endPointer(event);
        }
      });
      </script>
  </body>
</html>
