<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lrm;</title>
    <link rel="icon" type="image/x-icon" href="/no.ico">
    <style>
        @font-face {
            font-family: 'DeterminationMono';
            src: url('DeterminationMonoWeb.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: sans-serif;
        }

        #ayll {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            image-rendering: pixelated;
            display: block;
            opacity: 1;
            cursor: default;
            user-select: none;
            -webkit-user-drag: none;
        }

        #ayll2 {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            image-rendering: pixelated;
            display: block;
            opacity: 0;
            cursor: default;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        #kphsvnbl {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            width: 640px;
            max-width: calc(100vw - 40px);
            min-height: 120px;
            padding: 18px 24px;
            border: 10px solid white;
            background: rgba(0, 0, 0, 0.92);
            color: white;
            box-sizing: border-box;
            display: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            text-align: left;
            font-family: 'DeterminationMono', monospace;
            font-size: 32px;
            line-height: 1.5;
            white-space: pre-line;
            z-index: 10;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeSpeed;
        }

        #kphsvnblAlea {
            width: 100%;
        }
    </style>
</head>
<body>

<audio id="tbzpj" src="deltarune_piano_collections_by_trevor_alan_gomes.ogg" loop preload="auto"></audio>
<img id="ayll" src="images/darktree.png" alt="ayll">
<img id="ayll2" src="images/darken.png" alt="ayll">
<div id="kphsvnbl"><div id="kphsvnblAlea"></div></div>

<script>
(() => {
    const audio = document.getElementById("tbzpj");
    const treeImage = document.getElementById("ayll");
    const darkenImage = document.getElementById("ayll2");
    const messageBox = document.getElementById("kphsvnbl");
    const messageText = document.getElementById("kphsvnblAlea");
    const messages = [
        "* (You received the \"Egg\".)",
        "* (You asked for more.)",
        "* (Well, the man put his hand softly on your shoulder.)",
        "* (And, showing you his empty palm...)",
        "* (He put his finger to his mouth, smiled, and shook his head.)",
        "* (It seems you have everything.)",
        "* (...)",
        "* (He waved goodbye, looking away slightly after a moment.)",
        "* (...)",
        "* (You felt a strange melancholy.)",
        "* (It was a feeling that you should not look for the man anymore.)",
        "* (... even though you had never done such a thing in the first place.)",
        "* (...)"
    ];
    const returnUrl = sessionStorage.getItem("returnUrl") || document.referrer || "index.html";

    let messageIndex = 0;
    let isTyping = false;
    let activated = false;
    let musicStopped = false;
    let finished = false;

    const activate = () => {
        if (activated) return;

        activated = true;
        treeImage.src = "images/tree.png";
        darkenImage.style.display = "none";

        audio.play().catch(() => {});
    };

    const typeMessage = (message, callback) => {
        isTyping = true;
        messageText.textContent = "";
        let charIndex = 0;

        const typeInterval = setInterval(() => {
            messageText.textContent += message[charIndex++];

            if (charIndex >= message.length) {
                clearInterval(typeInterval);
                isTyping = false;

                if (callback) callback();
            }
        }, 35);
    };

    const showMessage = () => {
        if (!activated || finished || messageBox.style.display === "flex") return;

        messageBox.style.display = "flex";
        messageBox.style.opacity = "1";
        messageIndex = 0;

        typeMessage(messages[0]);
    };

    const nextMessage = () => {
        if (!activated || finished || isTyping) return;

        messageIndex++;

        if (messageIndex >= messages.length) return;

        if (messageIndex === 5) {
            darkenImage.style.opacity = "0.25";
            darkenImage.style.display = "block";
        }

        if (messageIndex === 8 && !musicStopped) {
            audio.pause();
            audio.currentTime = 0;
            musicStopped = true;
            localStorage.setItem("manegg2", "true");
            treeImage.style.opacity = "0";
        }

        if (messageIndex === 12) {
            localStorage.setItem("manegg2", "true");
            finished = true;
            location.href = "/";
            return;
        }

        typeMessage(messages[messageIndex]);
    };

    document.addEventListener("click", event => {
        if (finished) return;

        if (messageBox.style.display === "flex") {
            if (messageBox.contains(event.target)) {
                nextMessage();
            }
            return;
        }

        if (!activated) {
            activate();
            return;
        }

        showMessage();
    });
})();
</script>

</body>
</html>
